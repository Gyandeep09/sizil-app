[package]
name = "sizil"
version = "0.1.0"
description = "Sizil — Bring order to your project chaos."
edition = "2021"
rust-version = "1.77"

[lib]
name = "sizil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `bundled` compiles SQLite from source so the app has zero external
# runtime dependency on a system libsqlite3 — required for a "100% offline"
# desktop tool that just works after install.
rusqlite = { version = "0.31", features = ["bundled"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.15"

# Recursive, ignore-aware directory walking for the language scanner.
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
